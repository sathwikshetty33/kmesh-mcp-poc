name: mcp


on:
  push:
    branches: ["*"]
    paths:
      - "mcp/**"
      - ".github/workflows/mcp.yml"
  pull_request:
    paths:
      - "mcp/**"
      - ".github/workflows/mcp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp

    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: mcp/go.mod
          cache-dependency-path: mcp/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: Check go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check licence headers
        run: |
          missing=$(find . -name '*.go' -exec grep -L 'Copyright The Kmesh Authors' {} +)
          if [ -n "$missing" ]; then
            echo "these files are missing the Apache header:"
            echo "$missing"
            exit 1
          fi

      - name: Test
        run: go test ./...

      - name: Test with the race detector
        run: go test -race ./...
